! ==============================================================================
! Конфігурація сесії дзеркалювання трафіку Cisco Catalyst 2960/3750
! ==============================================================================
configure terminal

! Видалення можливих попередніх сесій
no monitor session 1

! Налаштування джерел моніторингу (трафік серверів, робочих місць та лабораторій)
monitor session 1 source vlan 10 both
monitor session 1 source vlan 20 both
monitor session 1 source vlan 30 both

! Налаштування інтерфейсу призначення (порт підключення сенсора Suricata)
monitor session 1 destination interface GigabitEthernet0/24 encapsulation replicate

! Активація опису інтерфейсу сенсора
interface GigabitEthernet0/24
 description *** CONNECTED TO NIDS SURICATA PROMISCUOUS PORT ***
 no ip address
 no shutdown
end

! Збереження активної конфігурації у постійну пам'ять
write memory
